name: Lint and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 15
        with:
          python-version: "3.14"

      # Everything pinned and pip-installed into a venv: the runner has no Docker
      # actions, and its shared tool cache carries other repositories' packages.
      - name: Install
        timeout-minutes: 15
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "ruff==0.15.21" "yamllint==1.35.1" "shellcheck-py==0.10.0.1" "pytest==8.3.4"

      - name: ruff
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m ruff check .
          "$RUNNER_TEMP/venv/bin/python" -m ruff format --check .

      - name: yamllint
        timeout-minutes: 15
        run: >-
          "$RUNNER_TEMP/venv/bin/yamllint" -d "{extends: relaxed, rules: {line-length: {max: 200}, comments: {min-spaces-from-content: 1}}}"
          repository.yaml start_page/config.yaml start_page/translations/en.yaml
          .gitea/workflows/ .github/workflows/

      - name: shellcheck
        timeout-minutes: 15
        run: '"$RUNNER_TEMP/venv/bin/shellcheck" start_page/run.sh'

      # The server runs on the base image's python3 (3.14 on Alpine 3.24); the
      # page, the options model and discovery are tested against a fake Uptime
      # Kuma and a fake Supervisor. Images are built by the GitHub workflow.
      - name: Tests
        timeout-minutes: 15
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest --durations=15 --junitxml=reports/junit-1.xml'

      # each test's time and result, kept whatever the outcome: the forge shows no job log
      - name: test results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: test-results-${{ github.job }}
          path: reports/
          retention-days: 14
