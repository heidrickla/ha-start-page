name: Lint and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Everything pinned and pip-installed: the runner has no Docker actions
      # and no preinstalled linters.
      - name: Install
        run: >-
          python -m pip install --quiet "ruff==0.15.21" "yamllint==1.35.1"
          "shellcheck-py==0.10.0.1" "pytest==8.3.4"

      - name: ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: yamllint
        run: >-
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}, comments: {min-spaces-from-content: 1}}}"
          repository.yaml start_page/config.yaml start_page/build.yaml start_page/translations/en.yaml
          .gitea/workflows/validate.yml

      - name: shellcheck
        run: shellcheck start_page/run.sh

      # The server runs on the base image's python3 (3.12); the page and the
      # options-to-model code are tested against a fake Uptime Kuma. The
      # image build itself is proven by `ha apps rebuild` on the host.
      - name: Tests
        run: python -m pytest
