[project]
name = "ha-start-page"
version = "0.1.0"
description = "Home Assistant add-on: every home service on one page, status from Uptime Kuma"
requires-python = ">=3.12"
license = "MIT"

# The server runs under the add-on base image's Alpine python3 (3.12 on
# Alpine 3.21), so the target is that, not Home Assistant's own floor.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "RUF", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
