name: Start Page
version: "0.1.0"
slug: start_page
description: Every home service on one page, with live status from Uptime Kuma
url: https://github.com/heidrickla/ha-start-page
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
stage: stable
advanced: false
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: The page over plain HTTP, for the LAN or a tunnel origin
ingress: true
ingress_port: 8090
panel_icon: mdi:view-dashboard-outline
panel_title: Start
watchdog: http://[HOST]:[PORT:8090]/healthz
options:
  title: Home
  tagline: start here
  lede: >-
    Everything in the house, and the outside links that support it.
    A dot is Uptime Kuma's verdict on the service behind the card.
  uptime_kuma_url: ""
  uptime_kuma_api_key: ""
  status_interval: 30
  services:
    - group: Home
      name: Home Assistant
      url: http://homeassistant.local:8123
      description: The house
      monitor: Home Assistant
schema:
  title: str
  tagline: str?
  lede: str?
  uptime_kuma_url: url?
  uptime_kuma_api_key: password?
  status_interval: int(10,600)?
  services:
    - group: str
      name: str
      url: url
      description: str?
      monitor: str?
