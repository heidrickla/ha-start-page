name: Start Page
version: "0.3.0"
slug: start_page
description: Every home service on one page, with live status from Uptime Kuma
url: https://github.com/heidrickla/ha-start-page
arch:
  - amd64
  - aarch64
startup: services
init: false
ports:
  8090/tcp: 8090
ingress: true
ingress_port: 8090
panel_icon: mdi:view-dashboard-outline
panel_title: Start
hassio_api: true
map:
  - type: ssl
    read_only: true
options:
  title: Home
  tagline: start here
  lede: >-
    Everything in the house, and the outside links that support it.
    A dot is Uptime Kuma's verdict on the service behind the card.
  discover_cards: true
  uptime_kuma_url: ""
  uptime_kuma_api_key: ""
  uptime_kuma_verify_tls: true
  uptime_kuma_ca_file: ""
  status_interval: 30
  services: []
schema:
  title: str
  tagline: str?
  lede: str?
  discover_cards: bool?
  uptime_kuma_url: url?
  uptime_kuma_api_key: password?
  uptime_kuma_verify_tls: bool?
  uptime_kuma_ca_file: str?
  status_interval: int(10,600)?
  services:
    - group: str
      name: str
      url: url
      description: str?
      monitor: str?
