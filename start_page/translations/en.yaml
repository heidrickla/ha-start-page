configuration:
  title:
    name: Title
    description: Brand text and browser title.
  tagline:
    name: Tagline
    description: The small line under the title.
  lede:
    name: Introduction
    description: The paragraph above the cards. Empty hides it.
  discover_cards:
    name: Discover cards
    description: A card for Home Assistant and one for each running app with a web interface, kept up to date. A card under Services with the same name replaces the discovered one.
  uptime_kuma_url:
    name: Uptime Kuma URL
    description: Base URL of Uptime Kuma as this app reaches it. Empty finds the Uptime Kuma app on this Home Assistant.
  uptime_kuma_api_key:
    name: Uptime Kuma API key
    description: From Uptime Kuma, Settings, API Keys. Needed for status dots; used to read status only.
  uptime_kuma_verify_tls:
    name: Verify Uptime Kuma's certificate
    description: On an https URL the key is sent only to a certificate that verifies. Off accepts any certificate.
  uptime_kuma_ca_file:
    name: Uptime Kuma CA file
    description: A CA certificate file under /ssl that signed Uptime Kuma's certificate, for example /ssl/ca.pem. Empty uses the system store.
  status_interval:
    name: Status interval
    description: Seconds between status reads, 10 to 600.
  services:
    name: Services
    description: Cards of your own, shown before the discovered ones.
    fields:
      group:
        name: Group
        description: Section heading. Sections appear in the order their first card does.
      name:
        name: Name
        description: Card title.
      url:
        name: URL
        description: Absolute http or https address the card opens.
      description:
        name: Description
        description: Second line on the card.
      monitor:
        name: Uptime Kuma monitor
        description: The monitor's name in Uptime Kuma, exactly as shown there. Gives the card a status dot.
network:
  8090/tcp: The page over plain HTTP, for the LAN or as a tunnel origin.
