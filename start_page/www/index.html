<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<link rel="icon" href="glyph.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="glyph.png" alt="" class="glyph">
    <span class="brandname">Start Page</span>
  </div>
  <div class="tools">
    <input id="filter" type="search" placeholder="Filter links…" aria-label="Filter links" autocomplete="off">
    <button id="themetoggle" class="ghost" type="button" aria-label="Toggle colour theme">Light</button>
  </div>
</header>

<main id="main">
  <section class="hero" aria-label="Service overview">
    <div class="hero-main">
      <p id="tagline" class="eyebrow">start here</p>
      <h1 id="title">Home</h1>
      <p id="lede" class="lede"></p>
    </div>
    <div class="hero-metrics" aria-label="Service counts">
      <div><strong id="service-count">—</strong><span>services</span></div>
      <div><strong id="group-count">—</strong><span>groups</span></div>
    </div>
    <p id="status" class="status-line" role="status">Status: waiting for the first check.</p>
  </section>
  <div id="groups"></div>
  <p id="empty" class="mute empty" hidden>Nothing matches that filter.</p>
  <p id="nocards" class="mute empty" hidden></p>
  <p id="problems" class="problems mono" hidden></p>
</main>

<footer class="foot mute mono">
  Edit the cards under Settings, Apps, Start Page, Configuration.
</footer>

<script src="app.js"></script>
</body>
</html>
